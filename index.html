<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f5f4;--ink:#14201f;--mute:#5d6b69;--line:#d5dcda;--card:#fff;--accent:#0f766e;--rec:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--ink:#e6eeec;--mute:#93a3a0;--line:#26332f;--card:#162120;--accent:#2dd4bf;--rec:#fb923c}}
:root[data-theme="dark"]{--bg:#0e1514;--ink:#e6eeec;--mute:#93a3a0;--line:#26332f;--card:#162120;--accent:#2dd4bf;--rec:#fb923c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:560px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:26px;margin:0 0 4px;font-weight:600}
.sub{color:var(--mute);margin:0 0 28px;font-family:system-ui,sans-serif;font-size:14px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:24px}
#mic{width:112px;height:112px;border-radius:50%;border:2px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer;display:grid;place-items:center}
#mic svg{width:40px;height:40px}
#mic.on{border-color:var(--rec);color:var(--rec);box-shadow:0 0 0 8px color-mix(in srgb,var(--rec) 18%,transparent)}
#mic:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#status{font-family:system-ui,sans-serif;font-size:14px;color:var(--mute);min-height:20px;text-align:center}
#live{min-height:56px;width:100%;padding:14px 16px;border:1px dashed var(--line);border-radius:10px;color:var(--mute)}
#live.has{color:var(--ink);border-style:solid;background:var(--card)}
.row{display:flex;justify-content:space-between;align-items:center;margin:28px 0 10px;font-family:system-ui,sans-serif;font-size:14px;color:var(--mute)}
select,.link{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.link{cursor:pointer;color:var(--mute)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
li time{display:block;font-family:system-ui,sans-serif;font-size:12px;color:var(--mute);margin-bottom:2px}
.empty{color:var(--mute);font-family:system-ui,sans-serif;font-size:14px}
.add{display:flex;gap:8px;margin-bottom:8px}
.add input,li input{flex:1;min-width:0;width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.btn{font:14px system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.acts{display:flex;gap:8px;margin-top:10px}
input:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){#mic{transition:box-shadow .2s,border-color .2s}}
</style>
</head>
<body>
<main>
  <h1>Say it, I'll catch it</h1>
  <p class="sub">Tap the microphone, speak naturally, tap again when you're done.</p>

  <div class="stage">
    <button id="mic" type="button" aria-label="Start listening" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
    </button>
    <div id="status" role="status" aria-live="polite">Ready</div>
    <div id="live">Your words will appear here.</div>
  </div>

  <div class="add">
    <input id="typed" type="text" placeholder="Or type a note" aria-label="Type a note" enterkeyhint="done">
    <button id="addBtn" type="button" class="btn pri">Add</button>
  </div>

  <label class="row" style="margin-top:20px">
    <span>Language</span>
    <select id="lang">
      <option value="en-US">English</option>
      <option value="fa-IR">Persian</option>
      <option value="de-DE">German</option>
      <option value="fr-FR">French</option>
      <option value="es-ES">Spanish</option>
    </select>
  </label>

  <div class="row"><span>Your notes</span><button class="link" id="clear" type="button">Clear</button></div>
  <ul id="list"></ul>
</main>

<script>
(function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var mic = document.getElementById('mic'), statusEl = document.getElementById('status');
  var live = document.getElementById('live'), list = document.getElementById('list');
  var langSel = document.getElementById('lang'), clearBtn = document.getElementById('clear');
  var rec = null, listening = false, finalText = '', interim = '', notes = [];

  try { notes = JSON.parse(localStorage.getItem('voice-notes') || '[]'); } catch (e) { notes = []; }
  try { var l = localStorage.getItem('voice-lang'); if (l) langSel.value = l; } catch (e) {}

  function save(){ try { localStorage.setItem('voice-notes', JSON.stringify(notes)); } catch (e) {} }

  function btn(label, fn, pri){
    var b = document.createElement('button'); b.type = 'button';
    b.className = 'btn' + (pri ? ' pri' : ''); b.textContent = label;
    b.addEventListener('click', function(){ fn(); }); return b;
  }

  function startEdit(li, n){
    li.innerHTML = '';
    var inp = document.createElement('input'); inp.type = 'text'; inp.value = n.text; inp.setAttribute('aria-label', 'Edit note');
    var a = document.createElement('div'); a.className = 'acts';
    function commit(){ var v = inp.value.trim(); if (v) { n.text = v; save(); } render(); }
    a.appendChild(btn('Save', commit, true));
    a.appendChild(btn('Cancel', render));
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') commit(); });
    li.appendChild(inp); li.appendChild(a); inp.focus();
  }

  function render(){
    list.innerHTML = '';
    if (!notes.length) { var p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Nothing yet. Speak or type your first note.'; list.appendChild(p); return; }
    notes.slice().reverse().forEach(function(n){
      var li = document.createElement('li'), t = document.createElement('time'), s = document.createElement('span'), a = document.createElement('div');
      t.textContent = new Date(n.at).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
      s.textContent = n.text; a.className = 'acts';
      a.appendChild(btn('Edit', function(){ startEdit(li, n); }));
      a.appendChild(btn('Delete', function(){ notes = notes.filter(function(x){ return x !== n; }); save(); render(); }));
      li.appendChild(t); li.appendChild(s); li.appendChild(a); list.appendChild(li);
    });
  }

  var typed = document.getElementById('typed');
  function addTyped(){
    var v = typed.value.trim(); if (!v) return;
    notes.push({text: v, at: Date.now()}); typed.value = ''; save(); render();
  }
  document.getElementById('addBtn').addEventListener('click', addTyped);
  typed.addEventListener('keydown', function(e){ if (e.key === 'Enter') addTyped(); });

  function showLive(){
    var txt = (finalText + ' ' + interim).trim();
    live.textContent = txt || 'Your words will appear here.';
    live.className = txt ? 'has' : '';
  }

  function setUI(on, msg){
    listening = on;
    mic.classList.toggle('on', on);
    mic.setAttribute('aria-pressed', on ? 'true' : 'false');
    mic.setAttribute('aria-label', on ? 'Stop listening' : 'Start listening');
    statusEl.textContent = msg;
  }

  if (!SR) {
    mic.disabled = true;
    statusEl.textContent = 'This browser can\u2019t do speech recognition. Open the page in Chrome, Edge or Safari.';
  } else {
    rec = new SR();
    rec.continuous = !/iPhone|iPad|iPod/.test(navigator.userAgent);
    rec.interimResults = true;

    rec.onresult = function(e){
      interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var r = e.results[i];
        if (r.isFinal) finalText += (finalText ? ' ' : '') + r[0].transcript.trim();
        else interim += r[0].transcript;
      }
      showLive();
    };
    rec.onerror = function(e){
      if (e.error === 'aborted') return;
      var m = {'not-allowed':'Microphone blocked. Allow microphone access for this page and try again.',
               'service-not-allowed':'Microphone blocked. Allow microphone access for this page and try again.',
               'no-speech':'Didn\u2019t hear anything. Tap the microphone and try again.',
               'audio-capture':'No microphone found.',
               'network':'Speech service unreachable. Check your connection.'}[e.error] || ('Speech error: ' + e.error);
      setUI(false, m);
    };
    rec.onend = function(){
      var text = (finalText + ' ' + interim).trim();
      if (text) { notes.push({text: text, at: Date.now()}); save(); render(); }
      finalText = ''; interim = ''; showLive();
      if (listening) setUI(false, text ? 'Saved. Tap to record another.' : 'Didn\u2019t catch that. Tap and try again.');
      else if (statusEl.textContent === 'Listening\u2026' || statusEl.textContent === 'Stopping\u2026') statusEl.textContent = text ? 'Saved. Tap to record another.' : 'Ready';
    };

    mic.addEventListener('click', function(){
      if (listening) { statusEl.textContent = 'Stopping\u2026'; listening = false; mic.classList.remove('on'); mic.setAttribute('aria-pressed','false'); rec.stop(); return; }
      finalText = ''; interim = ''; showLive();
      rec.lang = langSel.value;
      try { rec.start(); setUI(true, 'Listening\u2026'); } catch (err) { setUI(false, 'Couldn\u2019t start. Try again.'); }
    });
  }

  langSel.addEventListener('change', function(){ try { localStorage.setItem('voice-lang', langSel.value); } catch (e) {} });
  clearBtn.addEventListener('click', function(){ notes = []; save(); render(); });
  render();
})();
</script>
</body>
</html>
